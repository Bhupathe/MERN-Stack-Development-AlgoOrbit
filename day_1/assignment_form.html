<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <center><h1>Registration Form</h1></center>
    <center><form>
        <label>Name:</label>
        <input type="text" name="name" id="name" placeholder="Enter your name"><br><br>

        <label>Email:</label>
        <input type="email" name="email" id="email" placeholder="Enter your email"><br><br>

        <label>Age:</label>
        <input type="number" name="age" id="age" step="1" placeholder="Enter your age" value="18"><br><br>

        <label>Gender:</label>
        <input type="radio" id="gender" name="gender">Male
        <input type="radio" id="gender" name="gender">Female<br><br>

        <label>Password:</label>
        <input type="password" name="password" id="password" placeholder="Enter your password"><br><br>

        <label>Confirm Password</label>
        <input type="password" name="confirm_password" id="confirm_password" placeholder="Enter password again"><br><br>

        <input type="submit" value="Submit">
    </form></center>
</body>
</html>
