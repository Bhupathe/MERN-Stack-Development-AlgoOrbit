<html>
    <head>
	<title>Math Game</title>	
	<link rel='stylesheet' href='style.css'>
    </head>
    <body> 
	<div class="container">
	    <h1 class='title'>Simple Math Game</h1>
	    <p class='stopwatch' id='stopwatch'>00:00:00</p>

		<!------------------ Math Game ------------------>
		<div class="game">
			<div class="question">
				<p id="question"></p>
				<div class="timer">
					<span>Time Left:</span>
					<p id="timer">15</p>
				</div>
			</div>
			<div class="answer">
				<input 
					type="number" 
					name="answer"
					id="answer" 
					placeholder="Enter your answer" 
					required
				>
			</div>
			<div class="result">
				<span id="result"></span>
			</div>
		</div>

		<!-------------------- Game Start/Stop --------------------->
	    <div class='btn'>
			<button id ='start'>Start</button>
			<button id = 'submit' disabled>submit</button>
			<button id = 'reset' disabled>Reset</button>
	    </div>
	</div>
	<script src='index.js'></script>
    </body>
</html>
